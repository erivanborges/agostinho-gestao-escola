<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Gestão Escolar</title>

    <link rel="stylesheet" type="text/css" href="assets/css/style.css">

</head>
<body>

      
    <div class="layout">
        <!--MENU LATERAL-->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    SA
                </div>
                <div class="brand-name">
                    <strong>Sistema</strong>
                    <strong>Acadêmico</strong>
                </div>
            </div>

            <nav class="menu">
                <a href="" class="menu-item active">
					
					<span class="menu-icon">🏠</span>
					
                    Dashboard
                </a>
                <a href="" class="menu-item">
				
					<span class="menu-icon">🧑‍🎓</span>
					
                    Aluno
                </a>
            </nav>
			
			<div class="sidebar-footer">
				<strong>Front-End</strong>
				<small>Integração com API REST</small>
			<div>
			
        </aside>
		
		<!-- CONTEUDO PRINCIPAL -->
		<main class="main-content">
		
			<!-- CABECALHO -->
			<header class="topbar">
			
				<div>
					
					<span class="breadcrumb">
						Sistema / Dashboard
					</span>
					
					<h1>
						Dashboard Aluno
					</h1>
				
				</div>
				
				<div class="user">
				
					<div class="user-avatar">
						A
					</div>
					
					<div class="user-info">
					
						<strong>
							Administrador
						</strong>
						
						<small>
							Úsuário do sistema
						</small>
					
					</div>
					
				
				</div>
					
			</header>
			
			<!-- CONTEUDO -->
			
			<section class="content">
			
				<div id="message" class="message hidden">
				
				</div>
				
				<!-- CARDs -->
				<div class="card">
				
					<div class="card-icon">
						🧑‍🎓
					</div>
					
					<div>
						
						<span>
							Total de alunos
						</span>
						
						<strong id="totalAluno">
							0
						</strong>
							
					</div>
				
				</div>
				
				<!-- NOVOS CADASTRADOS -->
				<div class="card">
				
					<div class="card-icon">
						🧑‍🎓
					</div>
					
					<div>
						
						<span>
							Novos cadastrados
						</span>
						
						<strong id="novosCadastrados">
							0
						</strong>
							
					</div>
				
				</div>
				
				<!-- STATUS DA API -->
				<div class="card">
				
					<div class="card-icon">
						🧑‍🎓
					</div>
					
					<div>
						
						<span>
							Status da API
						</span>
						
						<strong id="apiStatus">
							Verificando...
						</strong>
							
					</div>
				
				</div>
			
			</section>
		
		</main>
    </div>

</body>
</html>
